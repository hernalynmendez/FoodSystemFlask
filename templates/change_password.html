{% extends "base.html" %}

{% block title %}Change Password - S&amp;R New York Style Pizza{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="section-title">Change Password</h2>
        <p class="section-subtitle mb-4">Update your account password</p>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Password Settings</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">Current Password</label>
                        <input type="password" class="form-control" id="old_password" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="new_password" name="new_password" required>
                        <small class="form-text">At least 6 characters</small>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-2">
                        <i class="fas fa-save"></i> Change Password
                    </button>
                    <a href="/profile" class="btn btn-secondary w-100">
                        <i class="fas fa-arrow-left"></i> Back to Profile
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
