{% extends "base.html" %}

{% block title %}Edit Order - Admin{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h3>Edit Order #{{ order.get('id') }}</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-control">
                    {% for s in ['pending','preparing','out for delivery','delivered','cancellation_requested','cancelled'] %}
                    <option value="{{ s }}" {% if order.get('status')==s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Payment Status</label>
                <select name="payment_status" class="form-control">
                    {% for p in ['pending','paid','refund_pending','refunded'] %}
                    <option value="{{ p }}" {% if order.get('payment_status')==p %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Remarks</label>
                <textarea name="remarks" class="form-control">{{ order.get('remarks','') }}</textarea>
            </div>
            <button class="btn btn-primary">Save</button>
            <a href="/admin/orders/view/{{ order.get('id') }}" class="btn btn-secondary">Back</a>
        </form>
    </div>
</div>
{% endblock %}
